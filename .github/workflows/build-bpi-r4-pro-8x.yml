# Builds the BPI-R4 Pro 8X with ./build.sh bpi-r4-pro-8x <variant>.
# The upstream revisions come from pins.conf; the dispatch inputs
# openwrt_commit/mtk_commit override them for a trial build.
# The images are always kept as a workflow artifact for 14 days; they replace
# the public releases only when "publish" is ticked.
name: Build BPI-R4 Pro 8X

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'Pro-8X-wifi'
        type: choice
        options:
          - Pro-8X-wifi
          - Pro-8X-wired
      repo_commit:
        description: 'Commit hash of this repository (leave empty for latest)'
        required: false
        default: ''
      openwrt_commit:
        description: 'OpenWrt commit hash (leave empty to use pins.conf)'
        required: false
        default: ''
      mtk_commit:
        description: 'MTK SDK commit hash (leave empty to use pins.conf)'
        required: false
        default: ''
      publish:
        description: 'Publish to the release tags (unchecked: images only as a workflow artifact)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.repo_commit || github.sha }}

      - name: Load build versions
        run: |
          grep -v '^\s*#' pins.conf | grep -v '^\s*$' >> $GITHUB_ENV
          [ -n "${{ github.event.inputs.openwrt_commit }}" ] && echo "OPENWRT_COMMIT=${{ github.event.inputs.openwrt_commit }}" >> $GITHUB_ENV || true
          [ -n "${{ github.event.inputs.mtk_commit }}" ] && echo "MTK_COMMIT=${{ github.event.inputs.mtk_commit }}" >> $GITHUB_ENV || true

      - name: Set build variables
        run: |
          VARIANT="${{ github.event.inputs.variant }}"

          # Not BUILD_VARIANT: the OpenWrt make reads that from the environment
          # and builds every package (U-Boot too) as that variant.
          if [ "$VARIANT" = "Pro-8X-wifi" ]; then
            echo "BOARD_VARIANT=standard" >> $GITHUB_ENV
            echo "RELEASE_TAGS=release-pro-8x-standard" >> $GITHUB_ENV
          else
            echo "BOARD_VARIANT=wired" >> $GITHUB_ENV
            echo "RELEASE_TAGS=release-pro-8x-wired" >> $GITHUB_ENV
          fi

      - name: Runner hardware
        run: |
          # Build times differ by up to 2x between runs of the same tree;
          # record what each runner was so slow runs can be told apart.
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)'; free -g | head -2

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Build
        run: ./build.sh bpi-r4-pro-8x "$BOARD_VARIANT"

      - name: Prepare release artifacts
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          FILOGIC="openwrt/bin/targets/mediatek/filogic"

          mkdir -p rel-pro
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-squashfs-sysupgrade.itb" rel-pro/bpi-r4-pro-8x.itb
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-nvme-img.bin"            rel-pro/
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-sdcard.img.gz"           rel-pro/
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-emmc-img.bin"            rel-pro/
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-snand-img.bin"           rel-pro/
          cp "${FILOGIC}/config.buildinfo"                                                          rel-pro/
          cp boards/bpi-r4-pro-8x/unifi/unifi-setup.sh                                                                  rel-pro/
          cp boards/bpi-r4-pro-8x/unifi/rc.local                                                                        rel-pro/
          cp boards/bpi-r4-pro-8x/unifi/rc-network.sh                                                                   rel-pro/
          cp boards/bpi-r4-pro-8x/unifi/unifi-network-setup-8gb.sh                                                      rel-pro/unifi-network-setup.sh
          cd rel-pro
          sha256sum bpi-r4-pro-8x.itb \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-nvme-img.bin \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-sdcard.img.gz \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-emmc-img.bin \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-snand-img.bin > sha256sums
          cd ..

      - name: Upload images as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: images-bpi-r4-pro-8x-${{ github.event.inputs.variant }}
          path: |
            rel-pro/*.itb
            rel-pro/openwrt-*-sdcard.img.gz
            rel-pro/config.buildinfo
          if-no-files-found: error
          retention-days: 14

      - name: Publish release-pro-8x-standard
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'Pro-8X-wifi')
        run: |
          gh release delete release-pro-8x-standard --yes --cleanup-tag 2>/dev/null || true
          gh release create release-pro-8x-standard rel-pro/* \
            --title "BPI-R4 Pro 8X standard WiFi (latest)" \
            --notes "Variant: standard (WiFi + wifimgr) | RAM: 8GB | BPI-R4 Pro 8X | Commit: ${{ github.event.inputs.repo_commit || github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-pro-8x-wired
        if: github.event.inputs.publish == 'true' && (github.event.inputs.variant == 'Pro-8X-wired')
        run: |
          gh release delete release-pro-8x-wired --yes --cleanup-tag 2>/dev/null || true
          gh release create release-pro-8x-wired rel-pro/* \
            --title "BPI-R4 Pro 8X wired (latest)" \
            --notes "Variant: wired (no wifimgr) | RAM: 8GB | BPI-R4 Pro 8X | Commit: ${{ github.event.inputs.repo_commit || github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
